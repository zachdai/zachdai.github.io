baseurl: "https://zachdai.github.io/"
languageCode: "en-us"
title: "Zach Dai"

menu:
  main:
    - name: Home
      url: ""
      weight: 1
    - name: Blog
      url: "blog/"
      weight: 2
    - name: Project
      url: "project/"
      weight: 3
    - name: Publication
      url: "publication/"
      weight: 4

params:
  description: "Zach Dai's personal website."
  github: "https://github.com/zachdai"

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 4
    ordered: false
  highlight:
    codeFences: true
    style: github
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
          - - $
            - $
