<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$',  right: '$$',  display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
        {left: '$',   right: '$',   display: false}
      ],
      throwOnError: false
    });
  });
</script>

<script>
/* ── TOC: viewport-driven collapse, no highlight ──
   Hugo TOC structure:
     #TableOfContents > ul > li (empty shell)
                              └─ ul > li > a          (H2)
                                       > ul > li > a  (H3)

   Logic:
   - Find all headings (H2 + H3) in the article with their TOC anchors.
   - On each scroll, determine which headings are "in view" by finding
     the topmost heading at/above the viewport top and the bottommost
     heading at/above the viewport bottom — everything in that range is
     considered visible.
   - For each H2 section: open it if ANY of its headings (itself or its
     H3 children) fall in the visible range; close it otherwise.
   - No active-link highlighting.
*/
document.addEventListener("DOMContentLoaded", function () {
  var toc = document.querySelector("nav.toc");
  if (!toc) return;
  var tocNav = toc.querySelector("#TableOfContents");
  if (!tocNav) return;

  /* ── 1. Build section map ── */
  /* Each entry: { h2Li, wrapper, toggle, open(), close(), headingEls[] }
     headingEls = [H2 el, H3 el, H3 el, ...]  in document order        */
  var sections = [];

  var h2Items = tocNav.querySelectorAll(":scope > ul > li > ul > li");
  h2Items.forEach(function (li) {
    var link  = li.querySelector(":scope > a");
    if (!link) return;

    var subUl = li.querySelector(":scope > ul"); /* H3 list, may be null */

    /* Wrap H3 list for CSS height animation */
    var wrapper = null, toggle = null;
    if (subUl) {
      wrapper = document.createElement("div");
      wrapper.className = "toc-collapsible";
      subUl.parentNode.insertBefore(wrapper, subUl);
      wrapper.appendChild(subUl);

      toggle = document.createElement("span");
      toggle.className = "toc-toggle";
      /* arrow shape drawn purely by CSS border, no text content needed */
      link.parentNode.insertBefore(toggle, link);
    }

    /* Collect DOM heading elements for this section */
    var headingEls = [];
    var h2id = link.getAttribute("href").slice(1);
    var h2el = document.getElementById(h2id);
    if (h2el) headingEls.push(h2el);

    if (subUl) {
      subUl.querySelectorAll("a").forEach(function (a) {
        var id = a.getAttribute("href").slice(1);
        var el = document.getElementById(id);
        if (el) headingEls.push(el);
      });
    }

    var sec = {
      li: li, link: link, wrapper: wrapper, toggle: toggle,
      headingEls: headingEls,
      open: function () {
        if (!wrapper) return;
        wrapper.classList.add("open");
        toggle.classList.add("open");
      },
      close: function () {
        if (!wrapper) return;
        wrapper.classList.remove("open");
        toggle.classList.remove("open");
      },
      isOpen: function () { return wrapper && wrapper.classList.contains("open"); }
    };

    /* Manual click on toggle still works */
    if (toggle) {
      toggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        sec.isOpen() ? sec.close() : sec.open();
      });
    }

    sections.push(sec);
  });

  /* ── 2. Flat list of ALL heading elements in document order ── */
  var allHeadingEls = [];
  sections.forEach(function (sec) {
    sec.headingEls.forEach(function (el) {
      allHeadingEls.push({ el: el, sec: sec });
    });
  });
  /* Sort by DOM position just in case */
  allHeadingEls.sort(function (a, b) {
    return a.el.compareDocumentPosition(b.el) & 4 ? -1 : 1;
  });

  /* ── 3. Find the last heading at-or-above a given y threshold ── */
  function lastHeadingAtOrAbove(thresholdY) {
    /* thresholdY in viewport coords */
    var result = -1;
    for (var i = 0; i < allHeadingEls.length; i++) {
      if (allHeadingEls[i].el.getBoundingClientRect().top <= thresholdY) {
        result = i;
      }
    }
    return result;
  }

  /* ── 4. Update collapse state ── */
  function update() {
    var vh = window.innerHeight;

    /* Index of topmost heading in view: last one at/above top of viewport */
    var topIdx    = lastHeadingAtOrAbove(1);   /* 1px so exactly-at-top counts */
    /* Index of bottommost heading in view: last one at/above bottom */
    var bottomIdx = lastHeadingAtOrAbove(vh);

    /* If nothing is above the fold yet, nothing is "in view" */
    if (topIdx < 0) {
      /* Page is scrolled before any heading — close all */
      sections.forEach(function (sec) { sec.close(); });
      return;
    }

    /* Visible range: topIdx .. max(topIdx, bottomIdx) */
    var lo = topIdx;
    var hi = bottomIdx >= 0 ? Math.max(topIdx, bottomIdx) : topIdx;

    /* Collect sections that have at least one heading in [lo, hi] */
    var visibleSecs = new Set();
    for (var i = lo; i <= hi; i++) {
      visibleSecs.add(allHeadingEls[i].sec);
    }

    sections.forEach(function (sec) {
      if (visibleSecs.has(sec)) {
        sec.open();
      } else {
        sec.close();
      }
    });
  }

  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) {
      requestAnimationFrame(function () { update(); ticking = false; });
      ticking = true;
    }
  });
  update();
});
</script>
